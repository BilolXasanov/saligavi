<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My One-Day Journal</title>
<style>
:root{--bg:#05070d;--navy:#0a1630;--blue:#2f7bff;--sky:#6fb2ff;--white:#f4f8ff;--glow:rgba(47,123,255,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at 20% 0%,var(--navy),var(--bg) 60%);color:var(--white);font-family:"Segoe UI",system-ui,Arial,sans-serif;min-height:100%;overflow-x:hidden}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{text-align:center;padding:60px 16px 30px;perspective:900px}
.names{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.name{position:relative;padding:16px 28px;border-radius:16px;background:linear-gradient(145deg,#0f2250,#060b18);border:1px solid rgba(111,178,255,.35);font-size:clamp(20px,4.5vw,34px);font-weight:800;letter-spacing:.5px;transform-style:preserve-3d;transition:transform .5s,box-shadow .5s;box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 0 rgba(47,123,255,0)}
.name span{display:block;text-shadow:1px 1px 0 #1c4fb5,2px 2px 0 #1a47a3,3px 3px 0 #153b88,4px 4px 12px #000;transform:translateZ(30px)}
.name::before{content:"";position:absolute;inset:-2px;border-radius:18px;background:conic-gradient(from 0deg,var(--blue),transparent 30%,var(--white),transparent 60%,var(--blue));z-index:-1;opacity:0;transition:opacity .4s;filter:blur(8px)}
.name::after{content:"";position:absolute;left:12%;right:12%;bottom:-18px;height:14px;background:radial-gradient(ellipse,rgba(47,123,255,.6),transparent 70%);filter:blur(4px)}
.name:hover{transform:rotateX(14deg) rotateY(-12deg) translateY(-6px);box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 40px var(--glow)}
.name:hover::before{opacity:1}
h1{margin:34px 0 6px;font-size:clamp(26px,6vw,52px);background:linear-gradient(90deg,var(--white),var(--sky),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.7;margin-bottom:30px}
.scene{width:110px;height:110px;margin:30px auto 10px;perspective:600px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 14s linear infinite}
.cube div{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;background:rgba(10,22,48,.85);border:1.5px solid var(--sky);color:var(--sky);box-shadow:inset 0 0 25px var(--glow),0 0 18px var(--glow)}
.cube div:nth-child(1){transform:translateZ(55px)}
.cube div:nth-child(2){transform:rotateY(90deg) translateZ(55px)}
.cube div:nth-child(3){transform:rotateY(180deg) translateZ(55px)}
.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(55px)}
.cube div:nth-child(5){transform:rotateX(90deg) translateZ(55px)}
.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(55px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px;position:relative}
main::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(var(--blue),var(--white),var(--blue));box-shadow:0 0 14px var(--blue);border-radius:3px}
.row{display:flex;width:50%;padding:14px 34px;position:relative;perspective:800px;opacity:0;transform:translateY(40px);transition:opacity .7s,transform .7s}
.row.show{opacity:1;transform:none}
.row:nth-child(even){margin-left:50%}
.row::before{content:"";position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--white);border:3px solid var(--blue);box-shadow:0 0 16px var(--blue);right:-8px;margin-top:-8px}
.row:nth-child(even)::before{right:auto;left:-8px}
.card{position:relative;width:100%;padding:20px 20px 20px 78px;border-radius:18px;background:linear-gradient(145deg,#0e1d3f,#070c1a);border:1px solid rgba(111,178,255,.25);box-shadow:0 18px 35px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .15s,box-shadow .3s;transform-style:preserve-3d;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);transition:left .8s}
.card:hover::before{left:140%}
.card:hover{box-shadow:0 28px 55px rgba(0,0,0,.75),0 0 30px var(--glow)}
.card::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--white));transition:width .5s}
.card:hover::after{width:100%}
.ic{position:absolute;left:18px;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:var(--white);background:linear-gradient(145deg,var(--blue),#123a8c);box-shadow:0 8px 0 #0b2559,0 14px 18px rgba(0,0,0,.55);transform:translateZ(40px);transition:transform .3s,box-shadow .3s}
.card:hover .ic{transform:translateZ(60px) translateY(-4px) rotate(-6deg);box-shadow:0 12px 0 #0b2559,0 20px 24px rgba(0,0,0,.6)}
.time{font-size:13px;letter-spacing:2px;color:var(--sky);font-weight:700;transform:translateZ(20px)}
.card h3{font-size:19px;margin:4px 0;transform:translateZ(25px)}
.card p{font-size:14px;opacity:.75;line-height:1.5;transform:translateZ(15px)}
footer{text-align:center;padding:30px 16px 50px;opacity:.6;font-size:14px}
footer b{color:var(--sky)}
@media(max-width:700px){
 main::before{left:18px}
 .row,.row:nth-child(even){width:100%;margin-left:0;padding:12px 0 12px 44px}
 .row::before,.row:nth-child(even)::before{left:10px;right:auto}
}
@media(prefers-reduced-motion:reduce){.cube{animation:none}.row{transition:none}}
</style>
</head>
<body>
<header>
  <div class="names">
    <div class="name"><span>Avazmatov Sardor</span></div>
    <div class="name"><span>Abduqodirov Davlat</span></div>
  </div>
  <div class="scene"><div class="cube" id="cube"></div></div>
  <h1>My One-Day Journal</h1>
  <p class="sub">From morning to night — a 3D day timeline</p>
</header>
<main id="tl"></main>
<footer>Avazmatov Sardor &amp; Abduqodirov Davlat &bull; <b>One day, many moments  Power by zizi Bilol</b></footer>
<script>
const P={
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
coffee:'<path d="M10 2v2M14 2v2M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/>',
laptop:'<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.3 2.5a1 1 0 0 1-.9 1.5H3.6a1 1 0 0 1-.9-1.5L4 16"/>',
food:'<path d="M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3zm0 0v7"/>',
code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
gym:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',
home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const day=[
["06:30","sun","Wake Up","Greeting the new day with a fresh wash and a light stretch."],
["07:30","coffee","Breakfast","Filling up on energy with hot tea or coffee."],
["09:00","laptop","Work / Study","The main tasks of the day and the important lessons."],
["13:00","food","Lunch","Eating together with friends and taking a short break."],
["15:00","code","Coding","Working on new projects with HTML, CSS and JS."],
["18:00","gym","Workout","A healthy mind in a healthy body — time to train."],
["20:00","home","Evening with Family","Dinner, conversation and talking about the day."],
["22:30","moon","Sleep","Wrapping up the day and resting for tomorrow."]
];
document.getElementById('cube').innerHTML=['sun','laptop','code','gym','home','moon'].map(n=>`<div>${ic(n)}</div>`).join('');
const tl=document.getElementById('tl');
tl.innerHTML=day.map(d=>`<div class="row"><div class="card"><div class="ic">${ic(d[1])}</div><div class="time">${d[0]}</div><h3>${d[2]}</h3><p>${d[3]}</p></div></div>`).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.row').forEach(r=>io.observe(r));
document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*16}deg) rotateX(${-y*16}deg)`});
  c.addEventListener('mouseleave',()=>{c.style.transform=''});
});
</script>
</body>
</html>
